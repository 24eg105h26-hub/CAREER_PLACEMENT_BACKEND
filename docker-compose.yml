version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartplacement-mysql
    environment:
      MYSQL_DATABASE: smartplacement
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: smartplacement-backend
    ports:
      - "8081:8081"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/smartplacement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      AI_MODE: dev-fallback
      SEED_DEFAULT_PASSWORD: Password123!
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smartplacement-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
