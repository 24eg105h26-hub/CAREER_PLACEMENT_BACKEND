server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartplacement-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

ai:
  mode: ${AI_MODE:live} # live, dev-fallback, disabled
  api-key: ${AI_API_KEY:${GEMINI_API_KEY:mock-key-for-dev}}
  api-url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
  model: ${AI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}

gemini:
  api-key: ${GEMINI_API_KEY:${AI_API_KEY:mock-key}}
  model: ${GEMINI_MODEL:${AI_MODEL:gemini-2.5-flash}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:${FRONTEND_URL:}}}
  file:
    upload-dir: ${FILE_STORAGE_PATH:uploads/resumes}
  seed:
    default-password: ${SEED_DEFAULT_PASSWORD:Password123!}
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
